name: Auto Update Hydra Source

on:
  schedule:
    # Executa a cada 12 horas (00:00 e 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite disparar manualmente na aba Actions do GitHub

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Build Mega Source
        run: |
          python build_mega_repo.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mega_source.json
          if git diff --staged --quiet; then
            echo "Nenhuma atualizacao encontrada nas fontes."
          else
            git commit -m "chore(auto-update): sync latest repacks from sources [skip ci]"
            git push
          fi
